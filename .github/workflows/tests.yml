name: Headless tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Python 3.12 / Windows
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install tested dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Run calculation, data, and replay tests without a desktop
        run: python -m unittest discover -s tests -v
      - name: Reproduce public annual audit and synthetic scenario
        run: |
          python docs/model_review/reproduce_forecast_audit.py --output verification/ci_forecast
          python examples/synthetic_import_test/check_example.py
